name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: pip install playwright && playwright install --with-deps chromium
      # same script you and Claude Code run locally — one definition of "working".
      # frontend/.env is gitignored, so the demo auto-login vars are set here (they
      # match backend/seed.py); delete them if the idea uses real multi-user accounts.
      - run: bash scripts/check.sh
        env:
          VITE_DEMO_EMAIL: demo@example.com
          VITE_DEMO_PASSWORD: demo-password1
