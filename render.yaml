# Render Blueprint: render.com -> New -> Blueprint -> pick this repo, and it creates
# the backend service AND a free Postgres database from this file. Data (accounts,
# uploads, everything) lives in Postgres, so it survives every deploy and restart.
# JWT_SECRET is generated for you; you're asked for ALLOWED_ORIGINS in the dashboard
# (paste your Vercel URL once you have it).
databases:
  - name: shellhacks-db
    plan: free

services:
  - type: web
    name: shellhacks-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: behind Render's proxy, trust X-Forwarded-For so the rate
    # limiter sees each visitor's real IP instead of one shared proxy IP
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shellhacks-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      # AI and voice (paste the values from backend/.env when Render asks; blank = the labeled fallbacks run)
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      # the Gemini key is on the paid tier (Sat 09:30): a higher whole-app cap, the stronger model for agent steps
      - key: AI_DAILY_LIMIT
        value: "1500/day"
      - key: GEMINI_AGENT_MODEL
        value: "gemini-3.5-flash-lite"
      # The free tier gets a fraction of one CPU: no background warm-ups at startup there (each is computed
      # on first use instead). Measured locally Sat 08:50: peak memory 236 MB through every heavy path.
      - key: DANGER_WARM
        value: "0"
      - key: FORECAST_PREWARM
        value: "0"
      - key: PLANTS_WARM
        value: ""
      - key: UNLOCK_WARM
        value: "0"
      - key: TIMELAPSE_WARM
        value: "0"
      - key: NARRATE_WARM
        value: "0"
